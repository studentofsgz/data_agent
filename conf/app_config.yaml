logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3306
  user: atguigu
  password: Atguigu.123
  database: meta

db_dw:
  host: localhost
  port: 3306
  user: atguigu
  password: Atguigu.123
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5


es:
  host: localhost
  port: 9200
  index_name: data_agent

rerank:
  column_top_k: 15
  metric_top_k: 5
  similarity_threshold: 0.3

schema_linking:
  exact_match_enabled: true
  exact_match_boost: 1.0

# SQL成本治理和应用层执行沙箱。阈值应按真实数据规模通过压测校准。
sql_execution:
  plan_guard_enabled: true
  reject_cartesian_joins: true
  max_estimated_rows: 1000000
  max_full_scan_rows: 100000
  max_join_tables: 8
  timeout_seconds: 30
  max_result_rows: 10000
  max_concurrent_queries: 4

# 第二阶段：问题歧义检测与多轮澄清。
ambiguity:
  enabled: true
  stop_on_ambiguity: true
  require_year_for_explicit_month: true
  clarify_vague_metric: true
  clarify_vague_time: true
  clarify_vague_top_k: true
  max_rounds: 3

# 多轮会话使用SQLite持久化LangGraph状态；生产环境可替换为PostgreSQL Saver。
conversation:
  persistent_checkpointer: true
  checkpoint_path: .runtime/checkpoints.sqlite
  session_ttl_seconds: 86400
  max_history_turns: 6
  result_preview_rows: 3

# SQL生成前的可解释置信度门禁，不使用大模型自报分数。
confidence:
  enabled: true
  high_threshold: 0.75
  low_threshold: 0.45
  strong_similarity_score: 0.55
  candidate_margin: 0.05
  max_confirmation_attempts: 2

# SQL执行后的有依据回答：限制模型上下文，并校验回答中的数字。
answer_generation:
  enabled: true
  timeout_seconds: 12
  max_rows: 20
  max_cell_chars: 200
  max_answer_chars: 1200
  max_highlights: 3
  fallback_max_rows: 5
  numeric_tolerance: 0.01

sql_cache:
  similarity_threshold: 0.95
  collection_name: data-agent-sql-cache

llm:
  model_name: deepseek-v4-flash
  api_key: sk-ws-H.EDYHPRI.wjsG.MEYCIQD4vrTv6qnzxYmQitw79Jz55tbipkfT9Q4yCE0ktglRWwIhAIraxcaMG5iqylGHC20T1gbZM1tiqUIVkjSMbf0kjIC0
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
